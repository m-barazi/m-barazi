# Erzeugt täglich die Contribution-Snake (hell + dunkel) im Branch "output".
name: Contribution-Snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#FF5D00&color_dots=#ebedf0,#ffd3b8,#ffad7a,#ff7a2e,#c24300
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF5D00&color_dots=#161b22,#4a1e05,#8a3608,#d9500b,#ff7a2e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
