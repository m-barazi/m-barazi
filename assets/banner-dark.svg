<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Manar Albarazi – Software Developer</title>
  <desc id="d">Finanzsoftware, Web und KI-Automatisierung</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="rgba(255,250,250,.07)"/></pattern>
    <radialGradient id="glow" cx="78%" cy="62%" r="55%"><stop offset="0" stop-color="#FF5D00" stop-opacity=".28"/><stop offset="1" stop-color="#FF5D00" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#FF5D00"/><stop offset="1" stop-color="#FFB066"/></linearGradient>
    <clipPath id="type"><rect class="typer" x="72" y="226" width="0" height="34"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .typer { animation: type 2.4s steps(53) .6s forwards; }
    .cursor { animation: blink 1s step-end infinite; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
    .node { animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; transform-box: fill-box; transform-origin: center; }
    .n2 { animation-delay: .25s; } .n3 { animation-delay: .5s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes type { to { width: 720px; } }
        @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {
      .typer { animation: none; width: 720px; } .cursor { animation: none; }
      .flow, .node, .pulse { animation: none; }
    }
  </style>

  <rect width="1280" height="320" rx="24" fill="#0D0101"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="rgba(255,250,250,.12)"/>

  <text x="72" y="84" class="sans" font-size="15" font-weight="700" letter-spacing="4" fill="#FF5D00">SOFTWARE DEVELOPER · KI-FIRST</text>
  <text x="70" y="158" class="sans" font-size="72" font-weight="800" letter-spacing="-2" fill="#FFFAFA">Manar <tspan fill="#FF5D00">Albarazi</tspan></text>
  <text x="72" y="200" class="sans" font-size="22" font-weight="500" fill="rgba(255,250,250,.72)">Finanzsoftware · Web &amp; WordPress · KI-Automatisierung</text>

  <g clip-path="url(#type)">
    <text x="72" y="250" class="mono" font-size="19" fill="#FFFAFA"><tspan fill="#FF5D00">❯</tspan> ship --erp --web --ai-agents --from-norddeutschland<tspan class="cursor" fill="#FF5D00"> ▋</tspan></text>
  </g>

  <!-- Flow: Finanzsoftware → Web → KI -->
  <path class="flow" d="M928 112 C 980 112, 990 168, 1040 168" fill="none" stroke="url(#line)" stroke-width="2.5"/>
  <path class="flow" d="M1040 168 C 1090 168, 1100 224, 1152 224" fill="none" stroke="url(#line)" stroke-width="2.5"/>
  <circle class="pulse" cx="1040" cy="168" r="44" fill="none" stroke="#FF5D00" stroke-opacity=".4"/>

  <g class="node"><rect x="828" y="86" width="100" height="52" rx="14" fill="#1A1212" stroke="rgba(255,250,250,.12)"/>
    <text x="878" y="118" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#FFFAFA">ERP</text></g>
  <g class="node n2"><rect x="990" y="142" width="100" height="52" rx="14" fill="#FF5D00"/>
    <text x="1040" y="174" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#0D0101">WEB</text></g>
  <g class="node n3"><rect x="1102" y="198" width="100" height="52" rx="14" fill="#1A1212" stroke="rgba(255,250,250,.12)"/>
    <text x="1152" y="230" text-anchor="middle" class="mono" font-size="16" font-weight="700" fill="#FFFAFA">AI</text></g>
</svg>
